spring.application.name=SimpleOdonto

# Server
server.port=8080

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/simpleodontodb
spring.datasource.username=${DB_USERNAME:vendecon}
spring.datasource.password=${DB_PASSWORD:vendecon}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Google OAuth
google.client-id=${GOOGLE_CLIENT_ID:91337212997-i9d7g3qeldl8ukuk85fvi8vu1bl7oad1.apps.googleusercontent.com}

# Multipart upload (imágenes radiográficas pueden ser grandes)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
