spring.application.name=HelloDoc

# Server — Railway inyecta PORT automáticamente
server.port=${PORT:8080}

# Datasource — Railway expone PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:simpleodontodb}
spring.datasource.username=${PGUSER:vendecon}
spring.datasource.password=${PGPASSWORD:vendecon}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT — JWT_SECRET es obligatorio (sin fallback). La app falla al iniciar si no está.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Google OAuth — valores reales via env vars GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}

# App base URL (for OAuth callbacks and webhook registration)
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4000}

# Lista de emails con rol ADMIN (separados por coma). Vacío = ningún admin.
app.admin-emails=${ADMIN_EMAILS:}

# Cloudflare Turnstile — captcha anti-bot en /api/auth/registro. Obligatorio.
app.turnstile.secret=${TURNSTILE_SECRET}

# Multipart upload (imágenes radiográficas pueden ser grandes)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
