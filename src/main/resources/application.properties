spring.application.name=HelloDoc

# Server — Railway inyecta PORT automáticamente
server.port=${PORT:8080}

# Datasource — Railway expone PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:simpleodontodb}
spring.datasource.username=${PGUSER:vendecon}
spring.datasource.password=${PGPASSWORD:vendecon}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT — JWT_SECRET es obligatorio (sin fallback). La app falla al iniciar si no está.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Google OAuth — valores reales via env vars GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}

# App base URL (for OAuth callbacks and webhook registration)
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4000}
# Token de la URL pública de la guía (/bienvenida/{token}). Debe coincidir con VITE_GUIA_TOKEN del front.
app.guia-token=${GUIA_TOKEN:2f89a8b7-fde0-4fff-af9e-f63adcad8c68}

# Lista de emails con rol ADMIN (separados por coma). Vacío = ningún admin.
app.admin-emails=${ADMIN_EMAILS:}

# Cloudflare Turnstile — captcha anti-bot en /api/auth/registro. Obligatorio.
app.turnstile.secret=${TURNSTILE_SECRET}

# Resend — envío de emails transaccionales. API key obligatoria.
# Sender por defecto onboarding@resend.dev (no requiere verificar dominio).
app.resend.api-key=${RESEND_API_KEY}
app.resend.from=${RESEND_FROM:onboarding@resend.dev}

# MercadoPago — suscripciones (preapproval) y webhook de pagos.
# Cada modo (test/prod) es un universo aislado en MP — vendedor, comprador, plan, app y webhook son distintos.
# Webhook (inbound): el endpoint elige el modo por URL → /api/mp/webhook/test usa los _TEST, /prod usa los _PROD.
# Creación de preapproval (outbound): cuando el back crea suscripciones desde AuthService.invitar, usa
#   MP_MODE para elegir qué token + plan-id. En test/dev queda en "test"; al salir a prod se cambia a "prod".
# Si el secret del modo activo está vacío, el validador permite todas las requests (solo para dev local).
app.mp.mode=${MP_MODE:test}
app.mp.access-token-test=${MP_ACCESS_TOKEN_TEST:}
app.mp.access-token-prod=${MP_ACCESS_TOKEN_PROD:}
app.mp.webhook-secret-test=${MP_WEBHOOK_SECRET_TEST:}
app.mp.webhook-secret-prod=${MP_WEBHOOK_SECRET_PROD:}
app.mp.preapproval-plan-id-test=${MP_PREAPPROVAL_PLAN_ID_TEST:}
app.mp.preapproval-plan-id-prod=${MP_PREAPPROVAL_PLAN_ID_PROD:}

# Multipart upload (imágenes radiográficas pueden ser grandes)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
