spring.application.name=SimpleOdonto

# Server — Railway inyecta PORT automáticamente
server.port=${PORT:8080}

# Datasource — Railway expone PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:simpleodontodb}
spring.datasource.username=${PGUSER:vendecon}
spring.datasource.password=${PGPASSWORD:vendecon}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Google OAuth
google.client-id=${GOOGLE_CLIENT_ID:91337212997-i9d7g3qeldl8ukuk85fvi8vu1bl7oad1.apps.googleusercontent.com}

# Multipart upload (imágenes radiográficas pueden ser grandes)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
